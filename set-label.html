<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Sett label på Jira-sak</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; box-sizing: border-box; }
  button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
  #result { margin-top: 1.5rem; padding: .75rem; white-space: pre-wrap; border-radius: 4px; display: none; }
  #result.ok { display: block; background: #e3fcef; color: #064; }
  #result.err { display: block; background: #ffebe6; color: #900; }
</style>
</head>
<body>
<h1>Sett label på Jira-sak</h1>
<form id="form">
  <label for="pat">Personal access token</label>
  <input id="pat" type="password" autocomplete="off" required>
  <label for="key">Saksnøkkel</label>
  <input id="key" placeholder="GTSANALYSE-123" required>
  <label for="lbl">Label</label>
  <input id="lbl" placeholder="min-label" required>
  <button type="submit">Legg til label</button>
</form>
<div id="result"></div>

<script>
  const JIRA_BASE = 'https://www.vegvesen.no/jira';
  const result = document.getElementById('result');

  function show(ok, text) {
    result.className = ok ? 'ok' : 'err';
    result.textContent = text;
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pat = document.getElementById('pat').value.trim();
    const key = document.getElementById('key').value.trim().toUpperCase();
    const label = document.getElementById('lbl').value.trim();
    if (/\s/.test(label)) return show(false, 'Label kan ikke inneholde mellomrom.');

    show(true, 'Sender ...');
    try {
      const res = await fetch(`${JIRA_BASE}/rest/api/2/issue/${encodeURIComponent(key)}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ update: { labels: [{ add: label }] } })
      });
      if (res.ok) return show(true, `OK: la til «${label}» på ${key} (HTTP ${res.status}).`);
      const body = await res.text();
      show(false, `Feil ${res.status} ${res.statusText}\n${body}`);
    } catch (err) {
      show(false, `Nettverksfeil: ${err.message}\n\nVanlig årsak er CORS: Jira må tillate opprinnelsen siden er lastet fra (se README/notat).`);
    }
  });
</script>
</body>
</html>
