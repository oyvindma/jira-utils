      scrollContainer.scrollTop += cardBox.bottom - containerBox.bottom + this.MARGIN;
    }
  },
};

/* ==========================================================================
   MoveFeedback: viser hvor kortene havnet, og gir mulighet til å angre
   ========================================================================== */

class MoveFeedback {
  static HIGHLIGHT_DURATION_MS = 1600;
  static MESSAGE_DURATION_MS = 6000;

  /** @param onUndoRequested () => void */
  constructor(messageElement, { onUndoRequested }) {
    this.messageElement = messageElement;
    this.onUndoRequested = onUndoRequested;
    this.hideTimer = null;
  }

  show({ issueKeys, targetGroup }) {
    this.highlightMovedCards(issueKeys);
    this.showMessage(issueKeys, targetGroup);
  }

  highlightMovedCards(issueKeys) {
    const movedCards = issueKeys.map(key => CardDomQueries.findCardElement(key)).filter(Boolean);
    CardReveal.reveal(movedCards[0]);
    for (const card of movedCards) card.classList.add('is-just-moved');
    setTimeout(() => movedCards.forEach(card => card.classList.remove('is-just-moved')), MoveFeedback.HIGHLIGHT_DURATION_MS);
  }

  showMessage(issueKeys, targetGroup) {
    const what = issueKeys.length === 1 ? issueKeys[0] : `${issueKeys.length} kort`;
    const undoButton = createElement('button', { text: 'Angre', attributes: { type: 'button' } });
    undoButton.addEventListener('click', () => this.onUndoRequested());
    this.messageElement.replaceChildren(
      createElement('span', { text: `Flyttet ${what} til «${describeGroup(targetGroup)}»` }),
      undoButton,
    );
    this.messageElement.hidden = false;
    clearTimeout(this.hideTimer);
    this.hideTimer = setTimeout(() => this.hide(), MoveFeedback.MESSAGE_DURATION_MS);
  }

  hide() {
    clearTimeout(this.hideTimer);
    this.messageElement.hidden = true;
  }
}

/* ==========================================================================
   KeyboardShortcuts: oversetter tastetrykk til handlinger
   1–9 flytter valgte kort til gruppe 1–9, 0 til usortert.
   ========================================================================== */

class KeyboardShortcuts {
  /**
   * @param handlers { onUndo, onClearSelection, onMoveSelectionToShortcut(number), onStepSelection(direction), onFocusSearch }
   */
  constructor(handlers) {
    this.handlers = handlers;
  }

  attach() {
    document.addEventListener('keydown', event => this.handleKeyDown(event));
  }

  handleKeyDown(event) {
    if (this.isTypingInField(event.target) || document.getElementById('dialog').open) return;

    const isUndo = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z';
    const action = isUndo ? () => this.handlers.onUndo()
      : event.key === 'Escape' ? () => this.handlers.onClearSelection()
      : /^[0-9]$/.test(event.key) && !event.ctrlKey && !event.metaKey && !event.altKey ? () => this.handlers.onMoveSelectionToShortcut(Number(event.key))
      : event.key === 'ArrowDown' ? () => this.handlers.onStepSelection(1)
      : event.key === 'ArrowUp' ? () => this.handlers.onStepSelection(-1)
      : event.key === '/' ? () => this.handlers.onFocusSearch()
      : null;
    if (!action) return;
    event.preventDefault();
    action();
  }

  isTypingInField(element) {
    return element instanceof Element
      && element.closest('input:not([type="checkbox"]), select, textarea, [contenteditable="true"]') !== null;
  }
}

/* ==========================================================================
   PanelResizer: lar brukeren dra i skillet mellom usortert og tavla
   ========================================================================== */

class PanelResizer {
  static MIN_WIDTH = 260;
  static MAX_SHARE_OF_WINDOW = 0.6;
  static KEYBOARD_STEP = 20;

  /** @param onWidthChosen (width|null) => void, null betyr standardbredde */
  constructor(resizerElement, workspaceElement, onWidthChosen) {
    this.resizerElement = resizerElement;
    this.workspaceElement = workspaceElement;
    this.onWidthChosen = onWidthChosen;
  }

  attach() {
    this.resizerElement.addEventListener('pointerdown', event => this.startDragging(event));
    this.resizerElement.addEventListener('dblclick', () => this.onWidthChosen(null));
    this.resizerElement.addEventListener('keydown', event => this.handleKey(event));
  }

  static applyWidth(workspaceElement, width) {
    if (width) workspaceElement.style.setProperty('--unsorted-panel-width', `${width}px`);
    else workspaceElement.style.removeProperty('--unsorted-panel-width');
  }

  startDragging(event) {
    event.preventDefault();
    this.resizerElement.setPointerCapture(event.pointerId);
    let chosenWidth = this.currentWidth();
    const followPointer = moveEvent => {
      chosenWidth = this.limitWidth(moveEvent.clientX - this.workspaceElement.getBoundingClientRect().left);
      PanelResizer.applyWidth(this.workspaceElement, chosenWidth);
    };
    const stopDragging = () => {
      this.resizerElement.removeEventListener('pointermove', followPointer);
      this.onWidthChosen(chosenWidth);
    };
    this.resizerElement.addEventListener('pointermove', followPointer);
    this.resizerElement.addEventListener('pointerup', stopDragging, { once: true });
  }

  handleKey(event) {
    const direction = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
    if (!direction) return;
    event.preventDefault();
    this.onWidthChosen(this.limitWidth(this.currentWidth() + direction * PanelResizer.KEYBOARD_STEP));
  }

  currentWidth() {
    return this.resizerElement.previousElementSibling.getBoundingClientRect().width;
  }

  limitWidth(width) {
    const maxWidth = window.innerWidth * PanelResizer.MAX_SHARE_OF_WINDOW;
    return Math.round(Math.min(maxWidth, Math.max(PanelResizer.MIN_WIDTH, width)));
  }
}

/* ==========================================================================
   FileDropImporter: slipp en CSV-fil hvor som helst på siden for å importere
   ========================================================================== */

class FileDropImporter {
  /** @param onFileDropped (file) => void */
  constructor(overlayElement, { onFileDropped }) {
    this.overlayElement = overlayElement;
    this.onFileDropped = onFileDropped;
  }

  /** Skiller filer fra kort som dras på tavla. */
  static isFileDrag(event) {
    return [...(event.dataTransfer?.types ?? [])].includes('Files');
  }

  attach() {
    document.addEventListener('dragenter', event => {
      if (FileDropImporter.isFileDrag(event) && !document.getElementById('dialog').open) this.showOverlay();
    });
    // Overlegget dekker hele siden, så dragleave skjer bare når fila dras ut av vinduet.
    this.overlayElement.addEventListener('dragover', event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    });
    this.overlayElement.addEventListener('dragleave', () => this.hideOverlay());
    this.overlayElement.addEventListener('drop', event => this.handleDrop(event));
  }

  handleDrop(event) {
    event.preventDefault();
    this.hideOverlay();
    const files = [...event.dataTransfer.files];
    const csvFile = files.find(file => this.isCsvFile(file));
    if (csvFile) {
      this.onFileDropped(csvFile);
    } else if (files.length > 0) {
      Dialog.inform('Ikke en CSV-fil', [`«${files[0].name}» kan ikke importeres. Slipp en CSV-eksport fra Jira.`]);
    }
  }

  isCsvFile(file) {
    return file.name.toLowerCase().endsWith('.csv') || file.type === 'text/csv';
  }

  showOverlay() { this.overlayElement.hidden = false; }
  hideOverlay() { this.overlayElement.hidden = true; }
}

/* ==========================================================================
   ImportWorkflow: fil -> validering -> sammenslåing eller erstatning
   ========================================================================== */

class ImportWorkflow {
  constructor(boardState, { onImported }) {
    this.state = boardState;
    this.onImported = onImported;
  }

  async importFile(file) {
    const text = await file.text();
    const mappingResult = JiraIssueMapper.map(CsvFormat.parse(text));
    const errors = ImportValidator.validate(mappingResult);
    if (errors.length > 0) {
      await this.showErrors(file.name, errors);
      return;
    }

    const importMode = this.state.hasIssues() ? await this.askImportMode() : 'replace';
    if (importMode === 'merge') this.state.mergeImport(mappingResult.issues);
    else if (importMode === 'replace') this.state.replaceImport(mappingResult.issues);
    else return;

    this.onImported(importMode);
  }

  showErrors(fileName, errors) {
    return Dialog.ask({
      title: 'Importen feilet',
      paragraphs: [`Filen «${fileName}» ble ikke importert. Tavla er uendret.`, ...errors.map(error => error.message)],
      details: errors.flatMap(error => error.details),
      actions: [{ label: 'Lukk', value: 'close', isPrimary: true }],
    });
  }

  async askImportMode() {
    const answer = await Dialog.ask({
      title: 'Hvordan vil du importere?',
      paragraphs: [
        'Slå sammen: plasseringene dine beholdes, data oppdateres, og nye tickets plasseres etter labels.',
        'Erstatt alt: tavla og gruppene nullstilles og bygges på nytt fra filen.',
      ],
      actions: [
        { label: 'Avbryt', value: 'cancel' },
        { label: 'Erstatt alt', value: 'replace' },
        { label: 'Slå sammen', value: 'merge', isPrimary: true },
      ],
    });
    return answer === 'merge' || answer === 'replace' ? answer : null;
  }
}

/* ==========================================================================
   LabelChangeCalculator: hvilke tickets får andre labels enn de har i Jira?
   Endring = { issue, group, newLabels[], addedLabels[], removedLabels[] }
   ========================================================================== */

const LabelChangeCalculator = {
  /** Sortert etter gruppenes rekkefølge, deretter key. Usorterte og uendrede tickets er ikke med. */
  findChanges(boardState) {
    const groups = boardState.getGroups();
    return boardState.getAllIssues()
      .filter(issue => boardState.getPlacement(issue.key) !== UNSORTED)
      .map(issue => this.describeChange(issue, boardState.getPlacement(issue.key), groups))
      .filter(change => change.addedLabels.length > 0 || change.removedLabels.length > 0)
      .sort((changeA, changeB) =>
        groups.indexOf(changeA.group) - groups.indexOf(changeB.group) || byIssueKey(changeA.issue, changeB.issue));
  },

  describeChange(issue, group, groups) {
    const newLabels = GroupLabelRules.resolveEffectiveLabels(issue, group, groups);
    return {
      issue,
      group,
      newLabels,
      addedLabels: newLabels.filter(label => !issue.labels.includes(label)),
      removedLabels: issue.labels.filter(label => !newLabels.includes(label)),
    };
  },
};

/* ==========================================================================
   ExportPreview: tabell over endringene, gruppert per epic
   ========================================================================== */

const ExportPreview = {
  render(changes, boardState) {
    const changesByEpic = this.groupByEpic(changes, boardState);
    const epicCount = [...changesByEpic.keys()].filter(epicKey => epicKey !== null).length;

    return createElement('div', { className: 'export-preview' }, [
      createElement('p', { text: this.describeTotals(changes, epicCount) }),
      createElement('div', { className: 'export-preview__scroll' }, [
        createElement('table', { className: 'change-table' }, [
          createElement('thead', {}, [createElement('tr', {}, [
            createElement('th', { text: 'Epic' }),
            createElement('th', { text: 'Ticket' }),
            createElement('th', { text: 'Endring i labels' }),
          ])]),
          createElement('tbody', {}, [...changesByEpic.entries()].flatMap(([epicKey, epicChanges]) =>
            this.renderEpicRows(epicKey ? boardState.getIssue(epicKey) : null, epicChanges))),
        ]),
      ]),
    ]);
  },

  describeTotals(changes, epicCount) {
    const issueText = changes.length === 1 ? '1 ticket' : `${changes.length} tickets`;
    const epicText = epicCount === 1 ? '1 epic' : `${epicCount} epics`;
    return `${issueText} får endrede labels, fordelt på ${epicText}. Bare disse tas med i CSV-filen.`;
  },

  /** Epicen selv og barna dens samles under epicen. Tickets uten epic kommer til slutt. */
  groupByEpic(changes, boardState) {
    const changesByEpic = new Map();
    for (const change of changes) {
      const epicKey = change.issue.type === EPIC_TYPE ? change.issue.key : change.issue.epicKey;
      const groupKey = epicKey && boardState.getIssue(epicKey) ? epicKey : null;
      changesByEpic.set(groupKey, [...(changesByEpic.get(groupKey) ?? []), change]);
    }
    const sortedEpicKeys = [...changesByEpic.keys()].sort((keyA, keyB) =>
      keyA === null ? 1 : keyB === null ? -1 : compareIssueKeys(keyA, keyB));
    return new Map(sortedEpicKeys.map(epicKey => [epicKey, changesByEpic.get(epicKey).sort((changeA, changeB) =>
      (changeA.issue.type === EPIC_TYPE ? -1 : 0) - (changeB.issue.type === EPIC_TYPE ? -1 : 0)
      || byIssueKey(changeA.issue, changeB.issue))]));
  },

  renderEpicRows(epic, epicChanges) {
    return epicChanges.map((change, index) => createElement('tr', {}, [
      index === 0 && this.renderEpicCell(epic, epicChanges.length),
      createElement('td', {}, [this.renderIssueDescription(change.issue)]),
      createElement('td', {}, [this.renderLabelChange(change)]),
    ]));
  },

  renderEpicCell(epic, rowCount) {
    const cell = createElement('td', { className: 'change-table__epic', attributes: { rowspan: String(rowCount) } });
    cell.append(epic ? this.renderIssueDescription(epic) : createElement('span', { className: 'change-table__no-epic', text: 'Uten epic' }));
    return cell;
  },

  renderIssueDescription(issue) {
    return createElement('div', { className: `change-table__issue card--${issue.type.toLowerCase()}` }, [
      createElement('span', { className: 'change-table__key', text: issue.key }),
      createElement('span', { text: issue.summary }),
    ]);
  },

  renderLabelChange({ addedLabels, removedLabels }) {
    return createElement('div', { className: 'label-change' }, [
      ...removedLabels.map(label => createElement('span', { className: 'label-chip label-chip--removed', text: `− ${label}`, attributes: { title: 'Fjernes' } })),
      ...addedLabels.map(label => createElement('span', { className: 'label-chip label-chip--added', text: `+ ${label}`, attributes: { title: 'Legges til' } })),
    ]);
  },
};

/* ==========================================================================
   ExportService: CSV med Issue key, Issue id, Summary, gruppe og labels slik de blir i Jira
   ========================================================================== */

const ExportService = {
  buildRows(changes) {
    const labelColumnCount = Math.max(1, ...changes.map(change => change.newLabels.length));
    const header = ['Issue key', 'Issue id', 'Summary', 'Gruppe', ...Array(labelColumnCount).fill('Labels')];
    const dataRows = changes.map(change => [
      change.issue.key,
      change.issue.id,
      change.issue.summary,
      change.group,
      ...change.newLabels,
      ...Array(labelColumnCount - change.newLabels.length).fill(''),
    ]);
    return [header, ...dataRows];
  },

  downloadCsv(changes) {
    const csvText = '﻿' + CsvFormat.stringify(this.buildRows(changes), EXPORT_DELIMITER);
    const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
    const downloadLink = createElement('a', {
      attributes: { href: URL.createObjectURL(blob), download: `jira-gruppering-${this.todayAsIsoDate()}.csv` },
    });
    document.body.append(downloadLink);
    downloadLink.click();
    downloadLink.remove();
    URL.revokeObjectURL(downloadLink.href);
  },

  todayAsIsoDate() {
    return new Date().toISOString().slice(0, 10);
  },
};

/* ==========================================================================
   OutsideClickCloser: lukker nedtrekkslister og paneler ved klikk utenfor
   ========================================================================== */

const OutsideClickCloser = {
  /** Klikk her lukker ikke noe (dialoger åpnet fra et panel, og knappene som åpner panelene). */
  IGNORED_SELECTOR: 'dialog, [data-opens-panel]',

  /** @param closables { isOpen(), contains(target), close() }[] */
  attach(closables) {
    document.addEventListener('pointerdown', event => {
      if (event.target.closest?.(this.IGNORED_SELECTOR)) return;
      for (const closable of closables) {
        if (closable.isOpen() && !closable.contains(event.target)) closable.close();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || document.getElementById('dialog').open) return;
      for (const closable of closables) if (closable.isOpen()) closable.close();
    });
  },

  forDetailsElement(detailsElement) {
    return {
      isOpen: () => detailsElement.open,
      contains: target => detailsElement.contains(target),
      close: () => { detailsElement.open = false; },
    };
  },
};

/* ==========================================================================
   SelectionBar: flytende linje som forteller hva som er valgt og hvilke taster som virker
   ========================================================================== */

const SelectionBar = {
  render(barElement, boardState, selectedKeys) {
    barElement.hidden = selectedKeys.length === 0;
    if (selectedKeys.length === 0) return;

    const groupCount = boardState.getGroups().length;
    const shortcutRange = groupCount === 0 ? null : groupCount === 1 ? '1' : `1–${Math.min(groupCount, 9)}`;
    const highlightedChildCount = selectedKeys
      .filter(key => boardState.getIssue(key)?.type === EPIC_TYPE)
      .reduce((count, epicKey) => count + boardState.getChildrenOfEpic(epicKey).length, 0);

    const parts = [
      createElement('strong', { text: selectedKeys.length === 1 ? selectedKeys[0] : `${selectedKeys.length} kort valgt` }),
      highlightedChildCount > 0 && createElement('span', { text: `${highlightedChildCount} barn uthevet` }),
      shortcutRange && createElement('span', {}, [createElement('kbd', { text: shortcutRange }), document.createTextNode(' flytt til gruppe')]),
      createElement('span', {}, [createElement('kbd', { text: '0' }), document.createTextNode(' usortert')]),
      createElement('span', {}, [createElement('kbd', { text: '↑↓' }), document.createTextNode(' neste kort')]),
      createElement('span', {}, [createElement('kbd', { text: 'Esc' }), document.createTextNode(' fjern valg')]),
    ];
    barElement.replaceChildren(...parts.filter(Boolean));
  },
};

/* ==========================================================================
   ThemeController: lyst eller mørkt tema
   ========================================================================== */

const ThemeController = {
  THEME_ORDER: ['system', 'light', 'dark'],
  BUTTON_TEXT: { system: '◐ Tema: System', light: '☀ Tema: Lyst', dark: '☾ Tema: Mørkt' },
  systemPrefersDark: window.matchMedia('(prefers-color-scheme: dark)'),

  /** Setter data-theme på <html> til 'light' eller 'dark'. */
  apply(themeSetting) {
    document.documentElement.dataset.theme = this.resolve(themeSetting);
  },

  resolve(themeSetting) {
    if (themeSetting === 'system') return this.systemPrefersDark.matches ? 'dark' : 'light';
    return themeSetting;
  },

  nextAfter(themeSetting) {
    const position = this.THEME_ORDER.indexOf(themeSetting);
    return this.THEME_ORDER[(position + 1) % this.THEME_ORDER.length];
  },

  describe(themeSetting) {
    return this.BUTTON_TEXT[themeSetting] ?? this.BUTTON_TEXT.system;
  },

  /** Følger med når operativsystemet bytter tema. */
  watchSystemTheme(readThemeSetting) {
    this.systemPrefersDark.addEventListener('change', () => this.apply(readThemeSetting()));
  },
};

/* ==========================================================================
   App: kobler modulene sammen
   ========================================================================== */

class App {
  constructor() {
    this.state = new BoardState(BoardRepository.load() ?? {});
    this.selection = new CardSelection();
    this.workspaceElement = document.querySelector('.workspace');
    this.boardElement = document.getElementById('board');
    this.cardRenderer = new CardRenderer(this.state);
    this.boardRenderer = new BoardRenderer(this.state, this.cardRenderer, this.boardElement);
    this.unsortedPanel = new UnsortedPanel(this.state, this.cardRenderer);
    this.settingsPanel = new SettingsPanel(this.state, document.getElementById('settings-panel'), {
      onCreateGroupRequested: name => this.createGroup(name),
      onRemoveGroupRequested: label => this.confirmAndRemoveGroup(label),
    });
    this.moveFeedback = new MoveFeedback(document.getElementById('move-message'), { onUndoRequested: () => this.undo() });
    this.issueMover = new IssueMover(this.state, { onMoved: move => this.moveFeedback.show(move) });
    this.dragDropController = new DragDropController(this.workspaceElement, this.selection, this.issueMover);
    this.keyboardShortcuts = new KeyboardShortcuts({
      onUndo: () => this.undo(),
      onClearSelection: () => this.selection.clear(),
      onMoveSelectionToShortcut: number => this.moveSelectionToShortcut(number),
      onStepSelection: direction => this.stepSelection(direction),
      onFocusSearch: () => document.getElementById('unsorted-search').focus(),
    });
    this.panelResizer = new PanelResizer(document.getElementById('panel-resizer'), this.workspaceElement,
      width => this.state.updateSettings({ unsortedPanelWidth: width }));
    this.importWorkflow = new ImportWorkflow(this.state, { onImported: importMode => this.handleImported(importMode) });
    this.fileDropImporter = new FileDropImporter(document.getElementById('file-drop-overlay'), {
      onFileDropped: file => this.importWorkflow.importFile(file),
    });
  }

  start() {
    ThemeController.watchSystemTheme(() => this.state.getSettings().theme);
    this.state.onChange(() => BoardRepository.save(this.state.toSnapshot()));
    this.state.onChange(() => this.renderAll());
    this.selection.onChange(() => this.renderSelection());

    this.dragDropController.attach();
    this.keyboardShortcuts.attach();
    this.panelResizer.attach();
    this.bindToolbar();
    this.bindBoardActions();
    this.bindCardSelection();
    this.bindOutsideClickClosing();
    this.fileDropImporter.attach();
    new ResizeObserver(() => this.boardRenderer.applyGridLayout()).observe(this.boardElement);

    this.renderAll();
  }

  renderAll() {
    ThemeController.apply(this.state.getSettings().theme);
    PanelResizer.applyWidth(this.workspaceElement, this.state.getSettings().unsortedPanelWidth);
    this.boardRenderer.render();
    this.unsortedPanel.render();
    this.settingsPanel.render();
    this.renderToolbarStatus();
    this.selection.keepOnly(key => this.state.getIssue(key) !== undefined);
    this.renderSelection();
  }

  renderToolbarStatus() {
    const totalCount = this.state.getAllIssues().length;
    document.getElementById('sorting-status').textContent = totalCount > 0
      ? `${this.state.countIssuesInGroup(UNSORTED)} usortert av ${totalCount}`
      : '';
    document.getElementById('compact-toggle').checked = this.state.getSettings().compactCards;
    document.getElementById('undo-button').disabled = !this.state.canUndo();
    document.getElementById('theme-button').textContent = ThemeController.describe(this.state.getSettings().theme);
  }

  renderSelection() {
    const selectedKeys = this.selection.getKeys();
    SelectionHighlighter.apply(this.workspaceElement, this.state, selectedKeys);
    SelectionBar.render(document.getElementById('selection-bar'), this.state, selectedKeys);
  }

  bindToolbar() {
    const fileInput = document.getElementById('csv-file-input');
    document.getElementById('upload-button').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const [file] = fileInput.files;
      fileInput.value = '';
      if (file) await this.importWorkflow.importFile(file);
    });

    document.getElementById('new-group-button').addEventListener('click', () => {
      const name = window.prompt('Navn på ny gruppe (label):');
      if (name !== null) this.createGroup(name);
    });
    document.getElementById('undo-button').addEventListener('click', () => this.undo());
    document.getElementById('settings-button').addEventListener('click', () => this.settingsPanel.toggle());
    this.trackToolbarHeight();
    document.getElementById('compact-toggle').addEventListener('change', event =>
      this.state.updateSettings({ compactCards: event.target.checked }));
    document.getElementById('export-button').addEventListener('click', () => this.exportCsv());
    document.getElementById('theme-button').addEventListener('click', () =>
      this.state.updateSettings({ theme: ThemeController.nextAfter(this.state.getSettings().theme) }));
  }

  /** Innstillingspanelet starter under menylinjen, så knappen som åpner og lukker det forblir synlig. */
  trackToolbarHeight() {
    const toolbar = document.querySelector('.toolbar');
    const updateHeight = () => document.documentElement.style.setProperty('--toolbar-height', `${toolbar.offsetHeight}px`);
    new ResizeObserver(updateHeight).observe(toolbar);
    updateHeight();
  }

  bindBoardActions() {
    this.workspaceElement.addEventListener('click', event => {
      const toggleButton = event.target.closest('[data-toggle-epic]');
      if (toggleButton) this.state.toggleEpicExpanded(toggleButton.dataset.toggleEpic);

      const removeButton = event.target.closest('[data-remove-group]');
      if (removeButton) this.confirmAndRemoveGroup(removeButton.dataset.removeGroup);

      const targetChip = event.target.closest('[data-scroll-to-group]');
      if (targetChip) this.boardRenderer.scrollToGroup(targetChip.dataset.scrollToGroup);
    });
  }

  /** Åpne nedtrekkslister og innstillingspanelet lukkes ved klikk utenfor eller Escape. */
  bindOutsideClickClosing() {
    const settingsPanelElement = document.getElementById('settings-panel');
    OutsideClickCloser.attach([
      ...[...document.querySelectorAll('details.label-filter')].map(details => OutsideClickCloser.forDetailsElement(details)),
      {
        isOpen: () => this.settingsPanel.isOpen,
        contains: target => settingsPanelElement.contains(target),
        close: () => this.settingsPanel.close(),
      },
    ]);
  }

  undo() {
    this.moveFeedback.hide();
    this.state.undo();
  }

  /**
   * Klikk velger ett kort (klikk igjen opphever). Ctrl/Cmd+klikk legger til eller fjerner.
   * Shift+klikk velger alle kort mellom forrige og dette. Klikk på tomt område fjerner valget.
   */
  bindCardSelection() {
    this.workspaceElement.addEventListener('click', event => {
      if (event.target.closest('a, button, input, select, label, summary, details, .panel-resizer')) return;
      const card = event.target.closest('.card');
      if (!card) {
        this.selection.clear();
        return;
      }
      const issueKey = card.dataset.issueKey;
      if (event.ctrlKey || event.metaKey) {
        this.selection.toggle(issueKey);
      } else if (event.shiftKey && this.selection.anchorKey) {
        this.selection.addRange(CardDomQueries.listKeysBetween(this.selection.anchorKey, issueKey));
      } else if (this.selection.has(issueKey) && this.selection.getKeys().length === 1) {
        this.selection.clear();
      } else {
        this.selection.selectOnly(issueKey);
      }
    });
  }

  /** Flytter valgte kort med tastatur, og velger neste kort slik at brukeren kan fortsette. */
  async moveSelectionToShortcut(shortcutNumber) {
    if (this.selection.isEmpty()) return;
    const targetGroup = shortcutNumber === 0 ? UNSORTED : this.state.getGroups()[shortcutNumber - 1];
    if (targetGroup === undefined) return;

    const selectedKeys = this.selection.getKeys();
    const nextKey = CardDomQueries.findNextRemainingTopLevelKey(selectedKeys);
    const hasMoved = await this.issueMover.moveIssues(selectedKeys, targetGroup);
    if (!hasMoved) return;

    const isNextKeyStillInPlace = nextKey !== null && this.state.getPlacement(nextKey) !== targetGroup;
    if (isNextKeyStillInPlace) this.selectAndReveal(nextKey);
    else this.selection.clear();
  }

  /** Piltaster flytter valget til forrige/neste synlige kort i samme gruppe. */
  stepSelection(direction) {
    const anchorKey = this.selection.anchorKey;
    const container = anchorKey ? CardDomQueries.findContainerOf(anchorKey) : document.querySelector('.unsorted-panel');
    if (!container) return;
    const visibleKeys = CardDomQueries.listVisibleCardKeys(container);
    const nextKey = anchorKey ? visibleKeys[visibleKeys.indexOf(anchorKey) + direction] : visibleKeys[0];
    if (nextKey) this.selectAndReveal(nextKey);
  }

  selectAndReveal(issueKey) {
    this.selection.selectOnly(issueKey);
    CardReveal.reveal(CardDomQueries.findCardElement(issueKey));
  }

  handleImported(importMode) {
    this.selection.clear();
    if (importMode === 'replace') this.settingsPanel.open();
  }

  createGroup(name) {
    const label = GroupLabelRules.toValidLabel(name);
    if (label === '') return;
    if (this.state.getGroups().includes(label)) {
      Dialog.inform('Gruppen finnes allerede', [`Det finnes allerede en gruppe som heter «${label}».`]);
      return;
    }
    this.state.addGroup(label);
  }

  async confirmAndRemoveGroup(label) {
    const issueCount = this.state.countIssuesInGroup(label);
    if (issueCount > 0) {
      const answer = await Dialog.ask({
        title: `Fjerne gruppen «${label}»?`,
        paragraphs: [`${issueCount} tickets i gruppen flyttes til usortert.`],
        actions: [
          { label: 'Avbryt', value: 'cancel' },
          { label: 'Fjern gruppen', value: 'remove', isPrimary: true },
        ],
      });
      if (answer !== 'remove') return;
    }
    this.state.removeGroup(label);
  }

  /** Viser endringene først. CSV-filen lastes bare ned hvis brukeren bekrefter. */
  async exportCsv() {
    const changes = LabelChangeCalculator.findChanges(this.state);
    if (changes.length === 0) {
      Dialog.inform('Ingen endringer å eksportere', ['Ingen tickets i gruppene har fått andre labels enn de har i Jira.']);
      return;
    }
    const answer = await Dialog.ask({
      title: 'Endringer som eksporteres',
      content: ExportPreview.render(changes, this.state),
      isWide: true,
      actions: [
        { label: 'Avbryt', value: 'cancel' },
        { label: `Last ned CSV (${changes.length})`, value: 'download', isPrimary: true },
      ],
    });
    if (answer === 'download') ExportService.downloadCsv(changes);
  }

}

new App().start();
</script>
